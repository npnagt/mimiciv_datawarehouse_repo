[project]
name = "mimic-datawarehouse"
version = "0.1.0"
description = "Load MIMIC-IV Clinical Database Demo CSV.gz files into an AWS RDS data warehouse"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "boto3>=1.34",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.4",
    "moto[s3,iam,rds,glue]>=5.0",
    # Glue provides PySpark (and `awsglue`) at job runtime -- this is for local
    # syntax/type checking of glue_jobs/*.py only, not for running them end to end.
    "pyspark>=3.5",
]

[project.scripts]
mimic-load = "mimic_datawarehouse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mimic_datawarehouse"]
